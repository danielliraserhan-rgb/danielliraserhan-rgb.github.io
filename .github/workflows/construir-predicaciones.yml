# Reconstruye las páginas de /predicaciones/ cuando se edita algo en _cms/
# (por ejemplo, desde Pages CMS) y publica el resultado en la misma rama.
name: Construir predicaciones
on:
  push:
    branches: [main]
    paths: ['_cms/**', 'imagenes/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: construir-predicaciones
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml pillow
      - run: python3 _cms/build.py
      - name: Guardar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruir predicaciones (${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
          # Los commits hechos con GITHUB_TOKEN no disparan GitHub Pages: se pide la publicación por API.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::warning::No se pudo pedir la publicación de Pages; ejecútala manualmente."
